<svg width="900" height="120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0d47a1;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1565c0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d47a1;stop-opacity:1" />
    </linearGradient>
    <style>
      .pulse { animation: pulse 2s ease-in-out infinite; }
      @keyframes pulse { 0%{opacity:1} 50%{opacity:0.4} 100%{opacity:1} }
      .slide { animation: slide 3s linear infinite; }
      @keyframes slide { 0%{transform:translateX(-900px)} 100%{transform:translateX(900px)} }
      .fadein { animation: fadein 1.5s ease-in forwards; }
      @keyframes fadein { from{opacity:0} to{opacity:1} }
    </style>
  </defs>
  <rect width="900" height="120" fill="url(#bgGrad)" rx="10" ry="10"/>
  <rect y="0" width="900" height="8" fill="#c62828" rx="10" ry="10"/>
  <rect y="112" width="900" height="8" fill="#c62828" rx="10" ry="10"/>
  <rect class="slide" y="0" width="80" height="120" fill="rgba(198,40,40,0.15)" rx="4"/>
  <text x="450" y="58" font-family="'Segoe UI', Arial, sans-serif" font-size="30" font-weight="bold" fill="white" text-anchor="middle" letter-spacing="4" class="pulse">🚧  UPDATES IN PROGRESS  🚧</text>
  <text x="450" y="95" font-family="'Segoe UI', Arial, sans-serif" font-size="16" fill="#90caf9" text-anchor="middle" letter-spacing="2" class="fadein">⚡  Production deployment coming soon — stay tuned  ⚡</text>
</svg>
